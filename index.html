<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>나이비스 호 승선 기록 조회</title>
<meta name="description" content="나이비스 호 항행일지 — 당신의 승선 기록을 조회합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbit&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="hero">
  <div class="wrap">
    <h1>나이비스 호 승선 기록 조회</h1>
    <p>이름과 생년월일을 넣으면, 선박 기록 보관소에서 오늘의 승선 기록을 찾아 드립니다.</p>
    <svg class="ship" viewBox="0 0 720 220" aria-hidden="true">
      <defs>
        <radialGradient id="hull" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#c9d4e0"/><stop offset=".6" stop-color="#7f8ea1"/><stop offset="1" stop-color="#3c4859"/></radialGradient>
        <radialGradient id="glow"><stop offset="0" stop-color="#9ff0c4"/><stop offset="1" stop-color="#3fae73" stop-opacity="0"/></radialGradient>
      </defs>
      <g id="stars" fill="#fff"></g>
      <g transform="translate(360 118) rotate(-90)">
        <ellipse cx="0" cy="96" rx="70" ry="10" fill="#000" opacity=".25"/>
        <path d="M0 -78 C 22 -78 26 -50 40 -20 C 62 22 70 52 52 74 C 34 94 -34 94 -52 74 C -70 52 -62 22 -40 -20 C -26 -50 -22 -78 0 -78 Z" fill="url(#hull)"/>
        <path d="M0 -78 C 22 -78 26 -50 40 -20" fill="none" stroke="#eef3f8" stroke-width="2" opacity=".7"/>
        <ellipse cx="0" cy="-66" rx="12" ry="7" fill="#1b2a3d" stroke="#9fb3c8" stroke-width="1.5"/>
        <rect x="-30" y="80" width="16" height="12" rx="3" fill="#2b3646"/><rect x="14" y="80" width="16" height="12" rx="3" fill="#2b3646"/>
        <circle cx="-22" cy="104" r="16" fill="url(#glow)"/><circle cx="22" cy="104" r="16" fill="url(#glow)"/>
      </g>
      <text x="470" y="125" fill="#aab6c6" font-size="13" font-family="Orbit">NÆVIS · 권외 중형 화물선</text>
    </svg>
  </div>
</header>

<main class="band">
  <div class="wrap">
    <form id="f" novalidate>
      <label>이름<input id="nm" autocomplete="off" placeholder="지금의 이름" maxlength="30"></label>
      <fieldset class="bd">
        <legend>생년월일</legend>
        <select id="by" aria-label="태어난 해"><option value="">년</option></select>
        <select id="bm" aria-label="태어난 달"><option value="">월</option></select>
        <select id="bdd" aria-label="태어난 날"><option value="">일</option></select>
      </fieldset>
      <button type="submit">기록 조회</button>
    </form>
    <p class="err" id="err" role="alert"></p>

    <article class="card" id="card" hidden aria-live="polite">
      <div class="head"><span id="no"></span><span>NÆVIS 선원 승선 기록부</span></div>
      <p class="born" id="born"></p>
      <div id="who" class="dept"></div>
      <div class="role" id="role"></div>
      <dl>
        <div><dt>첫 승선</dt><dd id="on"></dd></div>
        <div><dt>마지막 하선</dt><dd id="off"></dd></div>
        <div><dt>근무 일수</dt><dd id="days"></dd></div>
      </dl>
      <p class="text" id="txt"></p>
      <div class="acts">
        <button type="button" id="copy">결과 복사</button>
        <button type="button" class="ghost" id="again">다시 조회</button>
      </div>
      <p class="note" id="cnote"></p>
      <p class="note">오늘의 기록이에요. 내일 다시 조회하면 새로운 기록이 나와요.</p>
      <div class="stamp">NÆVIS<br>하선<br>확인</div>
    </article>
  </div>
</main>

<!-- 데이터 → 로직 순서로 불러옵니다. 파일을 더블클릭해도 동작하도록 JSON 대신 .js를 씁니다. -->
<script src="data/config.js"></script>
<script src="data/places.js"></script>
<script src="data/names.js"></script>
<script src="data/reasons.js"></script>
<script src="js/app.js"></script>
<!-- 방문자 집계 (GoatCounter — 김요정 키우기와 같은 대시보드) -->
<script data-goatcounter="https://owlspu.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
